<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGeoLearn: La Tua Piattaforma di Matematica e Geometria</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrFk5J72B00E7J+g/lQJ4O0P9Z+x2a1R9Kq6Zp0PjL2Bf1p2B9W3v/D/jP1p/Q==" crossorigin="anonymous">
    
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <header>
        <h1>MathGeoLearn</h1>
        <nav>
            <a href="/algebra">Algebra</a>
            <a href="/geometria">Geometria</a>
        </nav>
    </header>

    <main>
        <h2>La Formula Quadratica</h2>
        <span id="formula-quadratica"></span>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-F8r+d9E3/vC4a/d6F9q6hW7p8U1A5/D/jQ2B3p2Wp1Q7M0Q1p3O1C7D1P9J9O0S2" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" integrity="sha384-G4R1N/1vE7J/Vp9r/j3B1p1W2G6T2p9M+M1P5N9v2Y4Q7G9P8W3V/J9V3O1C7D1P9J9O0S2" crossorigin="anonymous"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Formula quadratica in LaTeX
            const latexFormula = "x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}";
            
            // Renderizza la formula nel <span>
            katex.render(latexFormula, document.getElementById("formula-quadratica"), {
                displayMode: true, // Usa modalità display (centrata e grande)
                throwOnError: false
            });
        });
    </script>
</body>
</html>
